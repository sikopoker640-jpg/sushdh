name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip
        run: |
          z=$(ls *Gemini*.zip 2>/dev/null | head -n1)
          [ -z "$z" ] && z=$(ls *.zip | head -n1)
          unzip -oq "$z"
      - name: Build
        run: cd PokerAI && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAI-APK
          path: PokerAI/app/build/outputs/apk/debug/*.apk
